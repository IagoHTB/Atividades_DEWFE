        <h1>Expressões</h1>
        <ol>
            <li>2H<sub>2</sub> + O<sub>2</sub> &rarr; 2H<sub>2</sub>O</li>
            <li>CO<sub>2</sub> + H<sub>2</sub>O &rarr; H<sub>2</sub>CO<sub>3</sub></li>
            <li>Vesfera: V = (4/3)&pi;r<sup>3</sup></li>
            <li>v = &Delta;s / &Delta;t</li>
            <li>x = (-b &plusmn; &radic;(b<sup>2</sup> &minus; 4ac)) / (2a)</li>
            <li>&sum;<sub>i=1</sub><sup>n</sup> i<sup>2</sup></li>
            <li>x<sup>2</sup> + y<sup>2</sup> = z<sup>2</sup></li>
            <li>(a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup></li>
            <li>log<sub>10</sub>(100) = 2</li>
            <li>cos(&alpha; + &beta;) = cos&alpha; &middot; cos&beta; &minus; sen&alpha; &middot; sen&beta;</li>

        </ol>
